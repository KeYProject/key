description = "Information-Flow / Non-interference calculus for Java using the KeY theorem prover"


dependencies {
    api(project(":key.core"))

    testImplementation(testFixtures(project(":key.core")))
}


tasks.register('testRunAllInfProofs', Test) {
    description = 'Prove/reload all keyfiles tagged for regression testing'
    group = "verification"
    filter {
        includeTestsMatching "RunAllProofsInfFlow"
    }
}


def rapDir = layout.buildDirectory.dir("generated-src/rap/").getOrNull()
sourceSets.test.java.srcDirs(rapDir)

tasks.register('generateRAPUnitTests', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set("de.uka.ilkd.key.informationflow.GenerateUnitTests")
    args(rapDir)
}


tasks.register("testRAP", Test) {
    description = "Testng the generated RAP unit tests"
    group = "verification"
    dependsOn('generateRAPUnitTests', 'testClasses')

    forkEvery = 1
    // run the regression proofs on up to 2 parallel JVMs (overridable with -PrapForks=N)
    maxParallelForks = (project.findProperty('rapForks') ?: '2') as int
    useJUnitPlatform()
    it.filter {
        it.includeTestsMatching "de.uka.ilkd.key.proof.runallproofs.gen.*"
    }
    // forward the save-and-reload switch to the proof runs in each fork; default on, skip the
    // reload with -PrapReload=false (or -Dkey.rap.reload=false)
    systemProperty 'key.rap.reload',
        (project.findProperty('rapReload')
                ?: System.getProperty('key.rap.reload', 'true'))
    // set heap size for the test JVM(s)
    minHeapSize = "1g"
    maxHeapSize = "3g"

    // set JVM arguments for the test JVM(s)
    //jvmArgs('-XX:MaxPermSize=1g')
    failFast=false
    testLogging.showStandardStreams = false
    testLogging.displayGranularity = 1
}