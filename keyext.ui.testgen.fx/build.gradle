plugins {
    // JavaFX is not bundled with the JDK; this plugin resolves the matching
    // platform-specific runtime artifacts (see gradle/libs.versions.toml).
    alias(libs.plugins.openjfx)
}

description = "JavaFX port of the keyext.ui.testgen extension (MP9.5)"

javafx {
    version = libs.versions.javafx.get()
    modules = ['javafx.base', 'javafx.controls', 'javafx.graphics']
}

dependencies {
    implementation project(":key.ui.fx")
    implementation project(":keyext.ui.testgen")
    // MP9.5 (integration review): like the other keyext FX ports, the module declares key.core on
    // its compile classpath — the SPI signatures (KeYGuiExtensionF.MainMenuF/ToolbarF/StartupF)
    // and the reused keyext.ui.testgen logic reference key.core types, and without it javac
    // cannot complete MainWindowF (its annotations touch KeYEnvironment). Runtime-wise key.core
    // arrives transitively anyway (via key.ui.fx) — no classpath change.
    implementation project(":key.core")
    // MP9.5 icon review: ikonli FontAwesome glyphs on the menu items and toolbar buttons (the
    // Swing TestGenerationAction/CounterExampleAction carry SMALL_ICONs)
    implementation libs.ikonli.javafx
    implementation libs.ikonli.fontawesome6
}
// reviewer request: the verify harness (de.uka.ilkd.key.gui.testgen.fx.TestgenVerifyF) lives in the test source set (test code must
// not ship in the main sources) and is published for the key.ui.fx run task via the
// "testArtifacts" configuration (MainWindowF invokes it reflectively on the run classpath).
configurations {
    testArtifacts
}
tasks.register('testJar', Jar) {
    archiveClassifier = 'test'
    from sourceSets.test.output
}
artifacts {
    testArtifacts testJar
}
