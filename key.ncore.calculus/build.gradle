description = "Pattern Matchern New core KeY theorem prover"

repositories {
    mavenCentral()
}

dependencies {
    api project(':key.util')
    api project(':key.ncore')
    implementation(libs.jspecify)

    annotationProcessor(libs.therapi.processor)
}

tasks.withType(JavaCompile).configureEach {
    // The Javadocs of the conditions implemented in this module are read by the varcond
    // documentation generator in key.core (see de.uka.ilkd.key.doc.VarcondDoc).
    options.compilerArgs << "-Ajavadoc.packages=org.key_project.prover.rules.conditions"
}

checkerFramework {
    if (System.getProperty("ENABLE_NULLNESS")) {
        checkers = [
                "org.checkerframework.checker.nullness.NullnessChecker",
        ]
        extraJavacArgs = [
                //"-AonlyDefs=^org\\.key_project\\.prover",
                "-Xmaxerrs", "10000",
                "-Astubs=$rootDir/key.util/src/main/checkerframework:permit-nullness-assertion-exception.astub",
                "-AstubNoWarnIfNotFound",
                "-Aversion",
        ]
    }
}