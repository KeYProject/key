# The EISOP NullnessChecker (-DENABLE_NULLNESS) runs in-process in the Gradle daemon and
# needs a large heap for the ~1600-file key.core module; 2g caused GC thrash (gates ran
# the full timeout). 6g fits the 30g RAM machine while leaving headroom for other JVMs.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# do not release automatically at Maven Central
mavenCentralAutomaticPublishing=false
