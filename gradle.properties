org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# do not release automatically at Maven Central
mavenCentralAutomaticPublishing=false

# Retry transient failures when downloading dependencies and metadata from repositories
# (connection errors and HTTP 5xx responses; internal Gradle properties, stable so far).
# 404 responses are never retried by Gradle: CI handles those with a single
# --refresh-dependencies fallback run.
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=500

# Reuse compiled outputs between builds: locally via the default build cache directory, on CI
# via gradle/actions/setup-gradle. Saves every CI test leg from recompiling the whole
# dependency graph of the module under test. Test tasks always execute: they are forced to
# rerun in build.gradle (upToDateWhen, cacheIf) because the cache key cannot capture the
# prover environment.
org.gradle.caching=true
# Execute independent tasks of the multi-module build concurrently.
org.gradle.parallel=true
# NOT enabling org.gradle.configuration-cache yet: build scripts read System.getProperty(...)
# at configuration time (e.g. ENABLE_NULLNESS in code_quality.yml), which the configuration
# cache cannot track and could therefore reuse stale entries. Migrate those reads to
# providers.systemProperty() first.
