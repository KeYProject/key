org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# do not release automatically at Maven Central
mavenCentralAutomaticPublishing=false

# Retry transient failures when downloading dependencies and metadata from repositories
# (connection errors and HTTP 5xx responses; internal Gradle properties, stable so far).
# 404 responses are never retried by Gradle: CI handles those with a single
# --refresh-dependencies fallback run.
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=500
