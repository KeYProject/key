description = "LLM UI"

dependencies {
    implementation project(":key.core")
    implementation project(":key.ui")

    implementation("org.apache.httpcomponents.client5:httpclient5:5.5.1")
    implementation("com.google.code.gson:gson:2.13.2")
    implementation(libs.jackson.dataformat.yaml)
    implementation("org.slf4j:jcl-over-slf4j:1.7.5")

    implementation platform("io.modelcontextprotocol.sdk:mcp-bom:2.1.0")
    implementation("io.modelcontextprotocol.sdk:mcp-core")
    implementation("io.modelcontextprotocol.sdk:mcp-json-jackson2")
}

// Bundles the shipped skills (skills/*.md) as the classpath resource /skills.zip from which
// SkillLibrary seeds the default skill directory on first use.
def bundleSkillsZip = tasks.register("bundleSkillsZip", Zip) {
    archiveFileName = "skills.zip"
    destinationDirectory = layout.buildDirectory.dir("skills-bundle")
    from(fileTree("skills") {
        include "*.md"
    })
}

sourceSets {
    main {
        resources {
            srcDir bundleSkillsZip.map { it.destinationDirectory }
        }
    }
}