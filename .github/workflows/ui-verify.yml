name: UI verify sweep (key.ui.fx)

# Nightly full per-flag regression sweep of the JavaFX UI (WP-11 deliverable): every
# -Dkey.fx.verify.* hook of key.ui.fx runs headlessly against real example proofs inside an
# Xvfb display (software rendering, one app at a time; ~4h, hence nightly rather than per-PR).
# The sweep script is key.ui.fx/ci/verify-sweep.sh; per-flag logs are uploaded as artifacts.
on:
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Setup SMT solvers
        uses: keyproject/setup-smt@v0
        with:
          z3Version: 4.13.0

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'corretto'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Xvfb, xdotool (key dismissal), graphviz (slicing DOT render)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool graphviz

      - name: Run the UI verify sweep
        run: bash key.ui.fx/ci/verify-sweep.sh

      - name: Upload sweep logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-verify-logs
          path: |
            build/ui-verify/*.log
            build/ui-verify/RESULTS.md
            build/ui-verify/failed-flags.txt
          if-no-files-found: error
