name: CodeQuality
on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - main
      - 'KeY-*'

jobs:
  checkerFramework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: 'corretto'
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew -DENABLE_NULLNESS=true compileTestJava

  nullaway:
    # Informational until key.core is NullAway-clean (~3.3k findings predate the rebase);
    # flip to a blocking gate once the campaign in docs/plan-jspecify-nullness.md is done.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: 'corretto'
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew -DENABLE_NULLAWAY=true compileTestJava

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'gradle'
      - name: Build with Gradle
        run: ./gradlew --parallel --continue spotlessCheck
