name: CodeQuality
on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - main
      - 'KeY-*'

# Superseded PR runs are cancelled; merge-queue and main-branch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checkerFramework:
    runs-on: ubuntu-latest
    # Bounded runtime: a hung build must not occupy a runner for the default 360 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: 'corretto'
      # Gradle caching is provided by setup-gradle; do not also set `cache: gradle` on
      # setup-java (double restore/save of the same paths, and its save fails on Windows).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew -DENABLE_NULLNESS=true compileTestJava

  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'corretto'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew --parallel --continue spotlessCheck
