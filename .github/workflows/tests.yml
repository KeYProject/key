name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches:
      - "main"
      - "KeY-*"
      - "releases/*"
  merge_group:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  checks: write

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest ]
        java: [ 21 ]
        modules: [
          keyext.exploration, keyext.slicing, key.ncore, key.ui, key.core,
          key.core.testgen, keyext.isabelletranslation,  keyext.ui.testgen,  key.ncore.calculus,
          key.util, key.core.example, keyext.caching, key.core.wd, key.core.infflow,
          keyext.proofmanagement]
    runs-on: ${{ matrix.os }}
    # Bounded runtime: a hung job must not occupy a runner for the default 360 minutes.
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup SMT solvers
        uses: keyproject/setup-smt@v0.3.0
        with:
          # Pin both solvers so CI is reproducible: an unpinned solver makes the SMT-dependent
          # tests (e.g. key.core.testgen) a moving target that fails intermittently when the
          # action's default version changes.
          z3Version: 4.13.0
          cvc5Version: 1.2.1

      - name: z3 version
        run: z3 --version

      - name: cvc5 version
        run: cvc5 --version

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test with Gradle
        shell: bash
        # Retry once when a leg fails on a transient dependency-resolution error (e.g. a
        # sporadic Maven Central 404, see run 43979238012). --refresh-dependencies also
        # discards Gradle's locally cached "module is missing" entries. Genuine test
        # failures abort without a second run.
        run: |
          set -o pipefail
          OUT=$(mktemp)
          if ! ./gradlew --continue ":${{ matrix.modules }}:test" | tee "$OUT"; then
            if grep -qE "Could not (find|resolve|download|GET) " "$OUT"; then
              echo "::warning::Transient dependency resolution failure; retrying with --refresh-dependencies"
              ./gradlew --refresh-dependencies --continue ":${{ matrix.modules }}:test"
            else
              exit 1
            fi
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.modules }}
          path: |
            **/build/test-results/*/*.xml
            **/build/reports/
            !**/jacocoTestReport.xml

  integration-tests:
    env:
      GH_TOKEN: ${{ github.token }}
    # The multi-core prover gates (testMt*) must be able to fail CI; the long-running proof
    # regression legs keep their historical advisory (continue-on-error) status. fail-fast is
    # off, so a red MT leg never cancels the sibling legs either way.
    continue-on-error: ${{ !startsWith(matrix.test, 'testMt') }}
    strategy:
      fail-fast: false
      matrix:
        test: [ testProveRules, testRunAllFunProofs, testRunAllInfProofs, testRunAllWdProofs, testMtStress, testMt2w, testMt4w ]
        os: [ ubuntu-24.04 ]
        java: [ 21 ]
    runs-on: ${{ matrix.os }}
    # Bounded runtime: the long proof regression legs take ~25 minutes; a hung job must not
    # occupy a runner for the default 360 minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'
          cache: 'gradle'

      - name: Setup SMT solvers
        uses: keyproject/setup-smt@v0.3.0
        with:
          z3Version: 4.13.0
          cvc5Version: 1.2.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: "Running tests: ${{ matrix.test }}"
        shell: bash
        # See the unit-tests job: retry once on transient dependency-resolution failures.
        run: |
          set -o pipefail
          OUT=$(mktemp)
          if ! ./gradlew --continue "${{ matrix.test }}" | tee "$OUT"; then
            if grep -qE "Could not (find|resolve|download|GET) " "$OUT"; then
              echo "::warning::Transient dependency resolution failure; retrying with --refresh-dependencies"
              ./gradlew --refresh-dependencies --continue "${{ matrix.test }}"
            else
              exit 1
            fi
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()        # run this step even if previous step failed
        with:
          name: test-results-${{ matrix.test }}
          path: |
            key.core/proofs/**        
            **/build/test-results/*/*.xml
            key.core/build/reports/runallproofs/*
            **/build/reports/
