name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches:
      - "main"
      - "KeY-*"
      - "releases/*"
  merge_group:

# Superseded PR runs are cancelled: a quick follow-up push would otherwise queue a full
# duplicate run (~40 jobs). Merge-queue and main-branch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Read-only: the workflow only builds, tests and uploads artifacts to its own run.
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest ]
        java: [ 21 ]
        group: [ core, rest ]
        include:
          # Compile coverage of the dropped test-less legs is preserved: the core leg builds
          # key.util, key.ncore, key.ncore.calculus and key.ncore.matcher (api dependencies of
          # key.core), the rest leg builds every keyext.* plugin via key.ui's runtimeOnly
          # dependencies. key.core.example has no dependents, so its sources are compiled
          # explicitly. The fun/inf proof regression legs run nightly in nightly-tests.yml.
          - group: core
            tasks: ":key.core:test"
          - group: rest
            tasks: ":key.util:test :key.ncore:test :key.ui:test :key.core.testgen:test :key.core.wd:test :key.core.infflow:test :keyext.exploration:test :keyext.slicing:test :keyext.caching:test :key.core.example:classes"
    runs-on: ${{ matrix.os }}
    # Bounded runtime: a hung job must not occupy a runner for the default 360 minutes.
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup SMT solvers
        uses: keyproject/setup-smt@v0.3.0
        with:
          # Pin both solvers so CI is reproducible: an unpinned solver makes the SMT-dependent
          # tests (e.g. key.core.testgen) a moving target that fails intermittently when the
          # action's default version changes.
          z3Version: 4.13.0
          cvc5Version: 1.2.1

      - name: z3 version
        run: z3 --version

      - name: cvc5 version
        run: cvc5 --version

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'
          # Gradle caching is provided by setup-gradle below; do not also set `cache: gradle`
          # here (double restore/save of the same paths, and the save fails on Windows).

      # Cross-run cache sharing (see gradle.properties, org.gradle.caching): setup-gradle saves
      # Gradle User Home incl. the local build cache to the Actions cache; only default-branch
      # runs write, PR/merge-queue legs restore the nearest entry and compile only their delta.
      # Sharing BETWEEN this run's parallel matrix legs is deliberately not attempted: they
      # overlap in wall time and the critical leg compiles the delta first, so intra-run
      # sharing cannot shorten the run. Verify effectiveness via the Setup Gradle job summary.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test with Gradle
        shell: bash
        # matrix.tasks is intentionally interpolated UNQUOTED: it is a whitespace-separated
        # list of task selectors, and quoting would hand Gradle a single argument it cannot
        # resolve ("Cannot locate tasks that match ':a:test :b:test'").
        # Retry once when a leg fails on a transient dependency-resolution error (e.g. a
        # sporadic Maven Central 404, see run 43979238012). --refresh-dependencies also
        # discards Gradle's locally cached "module is missing" entries. Genuine test
        # failures abort without a second run.
        run: |
          set -o pipefail
          OUT=$(mktemp)
          if ! ./gradlew --continue ${{ matrix.tasks }} | tee "$OUT"; then
            if grep -qE "Could not (find|resolve|download|GET) " "$OUT"; then
              echo "::warning::Transient dependency resolution failure; retrying with --refresh-dependencies"
              ./gradlew --refresh-dependencies --continue ${{ matrix.tasks }}
            else
              exit 1
            fi
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.group }}
          path: |
            **/build/test-results/*/*.xml
            **/build/reports/
            !**/jacocoTestReport.xml

  integration-tests:
    env:
      GH_TOKEN: ${{ github.token }}
    # The multi-core prover gates (testMt*) must be able to fail CI; the remaining proof
    # regression legs keep their historical advisory (continue-on-error) status. fail-fast is
    # off, so a red MT leg never cancels the sibling legs either way. The long fun/inf proof
    # regression legs (~25 min each) run nightly in nightly-tests.yml to bound the PR
    # turnaround by the gating tests.
    continue-on-error: ${{ !startsWith(matrix.test, 'testMt') }}
    strategy:
      fail-fast: false
      matrix:
        test: [ testProveRules, testRunAllWdProofs, testMtStress, testMt2w, testMt4w ]
        os: [ ubuntu-24.04 ]
        java: [ 21 ]
    runs-on: ${{ matrix.os }}
    # Bounded runtime: the long proof regression legs take ~25 minutes; a hung job must not
    # occupy a runner for the default 360 minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'
          # Gradle caching is provided by setup-gradle below; do not also set `cache: gradle`
          # here (double restore/save of the same paths, and the save fails on Windows).

      - name: Setup SMT solvers
        uses: keyproject/setup-smt@v0.3.0
        with:
          z3Version: 4.13.0
          cvc5Version: 1.2.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: "Running tests: ${{ matrix.test }}"
        shell: bash
        # See the unit-tests job: retry once on transient dependency-resolution failures.
        run: |
          set -o pipefail
          OUT=$(mktemp)
          if ! ./gradlew --continue "${{ matrix.test }}" | tee "$OUT"; then
            if grep -qE "Could not (find|resolve|download|GET) " "$OUT"; then
              echo "::warning::Transient dependency resolution failure; retrying with --refresh-dependencies"
              ./gradlew --refresh-dependencies --continue "${{ matrix.test }}"
            else
              exit 1
            fi
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()        # run this step even if previous step failed
        with:
          name: test-results-${{ matrix.test }}
          path: |
            key.core/proofs/**        
            **/build/test-results/*/*.xml
            key.core/build/reports/runallproofs/*
            **/build/reports/
