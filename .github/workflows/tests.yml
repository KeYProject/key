name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches:
      - "main"
      - "KeY-*"
      - "releases/*"
      - "prereleases/*"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest ]
        java: [ 21 ]
        group: [ core, rest ]
        include:
          - group: core
            tasks: ":key.core:test"
          - group: rest
            tasks: "test -x :key.core:test"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup SMT solvers
        uses: keyproject/setup-smt@v0
        with:
          # Pin both solvers so CI is reproducible: an unpinned solver makes the SMT-dependent
          # tests (e.g. key.core.testgen) a moving target that fails intermittently when the
          # action's default version changes.
          z3Version: 4.13.0
          cvc5Version: 1.2.1

      - name: z3 version
        run: z3 --version

      - name: cvc5 version
        run: cvc5 --version

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'
          # Gradle caching is provided by setup-gradle below; do not also set `cache: gradle`
          # here (double restore/save of the same paths, and the save fails on Windows).

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test with Gradle
        shell: bash
        # matrix.tasks is intentionally interpolated UNQUOTED: it is a whitespace-separated
        # list of Gradle task/option selectors, and quoting would hand Gradle a single
        # argument it cannot resolve.
        env:
          JACOCO_FLAG: ${{ matrix.os == 'ubuntu-24.04' && '-DjacocoEnabled=true' || '' }}
        run: ./gradlew --continue ${{ matrix.tasks }} ${JACOCO_FLAG}

      - name: Upload JaCoCo execution data
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-${{ matrix.group }}
          path: '**/build/jacoco/*.exec'
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.group }}
          path: |
            **/build/test-results/*/*.xml
            **/build/reports/
            !**/jacocoTestReport.xml

  integration-tests:
    env:
      GH_TOKEN: ${{ github.token }}
    continue-on-error: ${{ !matrix.gating }}
    strategy:
      fail-fast: false
      matrix:
        test: [ testProveRules, testRunAllFunProofs, testRunAllInfProofs, testRunAllWdProofs, mt-proofs ]
        os: [ ubuntu-24.04 ]
        java: [ 21 ]
        include:
          - test: mt-proofs
            tasks: "testMtStress testMt2w testMt4w"
            gating: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'

      - name: Setup SMT solvers
        uses: keyproject/setup-smt@v0
        with:
          z3Version: 4.13.0
          cvc5Version: 1.2.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: "Running tests: ${{ matrix.test }}"
        shell: bash
        # matrix.tasks is intentionally interpolated UNQUOTED: it may hold several
        # whitespace-separated task selectors (the combined MT leg).
        run: ./gradlew --continue ${{ matrix.tasks || matrix.test }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()        # run this step even if previous step failed
        with:
          name: test-results-${{ matrix.test }}
          path: |
            key.core/proofs/**        
            **/build/test-results/*/*.xml
            key.core/build/reports/runallproofs/*
            **/build/reports/

  coverage:
    needs: unit-tests
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download JaCoCo execution data
        uses: actions/download-artifact@v8
        with:
          pattern: jacoco-*
          merge-multiple: true

      - name: Build coverage report
        run: ./gradlew -DjacocoEnabled=true jacocoRootReport jacocoCobertura

      - name: Upload coverage report
        if: hashFiles('build/reports/jacoco/root/cobertura.xml') != ''
        uses: actions/upload-code-coverage@v1
        with:
          file: build/reports/jacoco/root/cobertura.xml
          language: Java
          label: code-coverage/jacoco
          fail-on-error: false
