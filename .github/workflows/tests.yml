name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches:
      - "main"
      - "KeY-*"
      - "releases/*"
  merge_group:

# Superseded PR runs are cancelled: a quick follow-up push would otherwise queue a full
# duplicate run (~40 jobs). Merge-queue and main-branch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Read-only: the workflow only builds, tests and uploads artifacts to its own run.
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest ]
        java: [ 21 ]
        group: [ core, rest ]
        include:
          # `core` runs key.core's tests. `rest` runs every other module's test task through
          # the root `test` selector with key.core excluded, so modules added later are picked
          # up automatically; test-less modules still compile through their testClasses
          # dependency.
          - group: core
            tasks: ":key.core:test"
          - group: rest
            tasks: "test -x :key.core:test"
    runs-on: ${{ matrix.os }}
    # Bounded runtime: a hung job must not occupy a runner for the default 360 minutes.
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup SMT solvers
        uses: keyproject/setup-smt@v0.3.0
        with:
          # Pin both solvers so CI is reproducible: an unpinned solver makes the SMT-dependent
          # tests (e.g. key.core.testgen) a moving target that fails intermittently when the
          # action's default version changes.
          z3Version: 4.13.0
          cvc5Version: 1.2.1

      - name: z3 version
        run: z3 --version

      - name: cvc5 version
        run: cvc5 --version

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'
          # Gradle caching is provided by setup-gradle below; do not also set `cache: gradle`
          # here (double restore/save of the same paths, and the save fails on Windows).

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test with Gradle
        shell: bash
        # matrix.tasks is intentionally interpolated UNQUOTED: it is a whitespace-separated
        # list of Gradle task/option selectors, and quoting would hand Gradle a single
        # argument it cannot resolve.
        run: ./gradlew --continue ${{ matrix.tasks }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.group }}
          path: |
            **/build/test-results/*/*.xml
            **/build/reports/
            !**/jacocoTestReport.xml

  integration-tests:
    env:
      GH_TOKEN: ${{ github.token }}
    # The combined multi-core prover leg (testMt*) must be able to fail CI; the remaining proof
    # regression legs keep their historical advisory (continue-on-error) status. fail-fast is
    # off, so a red leg never cancels its siblings. The three MT tasks share one job so they
    # share checkout, SDK, SMT and Gradle setup; `--continue` still runs all of them. The long
    # functional (fun) and information-flow (inf) proof corpora (~25 min each) stay here with
    # their historical advisory status.
    continue-on-error: ${{ !matrix.gating }}
    strategy:
      fail-fast: false
      matrix:
        test: [ testProveRules, testRunAllFunProofs, testRunAllInfProofs, testRunAllWdProofs, mt-proofs ]
        os: [ ubuntu-24.04 ]
        java: [ 21 ]
        include:
          - test: mt-proofs
            tasks: "testMtStress testMt2w testMt4w"
            gating: true
    runs-on: ${{ matrix.os }}
    # Bounded runtime: the long proof regression legs take ~25 minutes each; a hung job must
    # not occupy a runner for the default 360 minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'
          # Gradle caching is provided by setup-gradle below; do not also set `cache: gradle`
          # here (double restore/save of the same paths, and the save fails on Windows).

      - name: Setup SMT solvers
        uses: keyproject/setup-smt@v0.3.0
        with:
          z3Version: 4.13.0
          cvc5Version: 1.2.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: "Running tests: ${{ matrix.test }}"
        shell: bash
        # matrix.tasks is intentionally interpolated UNQUOTED: it may hold several
        # whitespace-separated task selectors (the combined MT leg).
        run: ./gradlew --continue ${{ matrix.tasks || matrix.test }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()        # run this step even if previous step failed
        with:
          name: test-results-${{ matrix.test }}
          path: |
            key.core/proofs/**        
            **/build/test-results/*/*.xml
            key.core/build/reports/runallproofs/*
            **/build/reports/
