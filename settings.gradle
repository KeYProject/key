plugins {
    id("org.gradle.toolchains.foojay-resolver-convention").version("1.0.0")
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

//include "recoder"

include "key.util"
include "key.ncore"
include 'key.ncore.calculus'
include 'key.ncore.matcher'

include "key.core"
//include "key.core.rifl"
include "key.core.infflow"
include "key.core.wd"
include "key.core.testgen"

include "key.core.example"

// The Swing UI (de.uka.ilkd.key.core.Main) is the legacy UI — it keeps shipping until the
// retirement decision documented in key.ui.fx/SWING-RETIREMENT.md (WP-11).
include "key.ui"
// The JavaFX UI (de.uka.ilkd.key.core.fx.MainEx) is the documented default entry point;
// see key.ui.fx/README.md for run tasks and the key.fx.* property whitelist.
include "key.ui.fx"

include "keyext.ui.testgen"
include "keyext.proofmanagement"
include "keyext.exploration"
include "keyext.slicing"
include "keyext.caching"
include "keyext.isabelletranslation"

// MP9.1-9.6: JavaFX ports of the keyext extensions (one FX module per extension).
// Each module depends on :key.ui.fx and its keyext counterpart; the providers are
// discovered via the service loader (KeYGuiExtensionF) on the :key.ui.fx runtime classpath.
include "keyext.caching.fx"
include "keyext.exploration.fx"
include "keyext.isabelletranslation.fx"
include "keyext.slicing.fx"
include "keyext.ui.testgen.fx"
include "keyext.proofmanagement.fx"

