plugins {
    // JavaFX is not bundled with the JDK; this plugin resolves the matching
    // platform-specific runtime artifacts (see gradle/libs.versions.toml).
    alias(libs.plugins.openjfx)
}

description = "JavaFX port of the keyext.isabelletranslation extension (MP9.3)"

javafx {
    version = libs.versions.javafx.get()
    modules = ['javafx.base', 'javafx.controls', 'javafx.graphics']
}

dependencies {
    implementation project(":key.ui.fx")
    implementation project(":keyext.isabelletranslation")

    // The FX SPI is declared with key.core types (Goal, PosInSequent, Services, ...), and both
    // key.ui.fx and the keyext module use non-transitive `implementation` dependencies; the
    // provider therefore needs key.core on its own compile classpath. (Scaffold adjustment.)
    implementation project(":key.core")
}
